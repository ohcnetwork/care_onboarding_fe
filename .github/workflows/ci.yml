name: Plugin checks and deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: onboarding-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ONBOARDING_BASE_PATH: /care_onboarding_fe/
      ONBOARDING_REMOTE_URL: http://127.0.0.1:4178/care_onboarding_fe/assets/remoteEntry.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run convert && git diff --exit-code -- data_source/activity-definitions
      - uses: actions/upload-artifact@v4
        with:
          name: care_onboarding_fe
          path: dist/
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy plugin to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
